services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: casemgr
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD（参考 .env.example）}
      POSTGRES_DB: casemgr
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casemgr -d casemgr"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 生产模式（禁用 DEMO 自动登录等所有调试绕过）
      NODE_ENV: production
      DATABASE_URL: postgres://casemgr:${DB_PASSWORD:?请设置 DB_PASSWORD}@db:5432/casemgr
      SESSION_SECRET: ${SESSION_SECRET:?请设置 SESSION_SECRET 环境变量}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD（管理员初始密码）}
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      PORT: 3000
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # 默认使用命名卷；如需复用宿主目录（如旧实例遗留数据），设置 UPLOADS_DIR=/mnt/case-manager/uploads
      - ${UPLOADS_DIR:-uploads}:/app/uploads
      - ${BACKUPS_DIR:-backups}:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  uploads:
  backups:
